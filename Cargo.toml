[package]
name = "lpkg"
version = "0.2.1"
edition = "2021"
description = "A winget-like package orchestrator for Ubuntu/Debian-based Linux"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MatoloJr/lpkg"
homepage = "https://github.com/MatoloJr/lpkg"
keywords = ["package-manager", "apt", "flatpak", "snap", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "lpkg"
path = "src/main.rs"

[lib]
name = "lpkg"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "7"
directories = "5"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
walkdir = "2"
which = "7"

[dev-dependencies]
tempfile = "3"
