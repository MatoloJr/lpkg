name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCH="x86_64"
          STAGE="dist/lpkg-${VERSION}-linux-${ARCH}"
          mkdir -p "$STAGE/data"
          cp target/release/lpkg "$STAGE/lpkg"
          cp data/aliases.toml data/direct-deb-index.json "$STAGE/data/"
          cp README.md "$STAGE/"
          tar -C dist -czf "dist/lpkg-${VERSION}-linux-${ARCH}.tar.gz" "lpkg-${VERSION}-linux-${ARCH}"
          cp target/release/lpkg "dist/lpkg-${VERSION}-linux-${ARCH}-bin"

      - name: Build .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lpkg-*.tar.gz
            dist/lpkg-*-bin
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/matolojr/lpkg
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
